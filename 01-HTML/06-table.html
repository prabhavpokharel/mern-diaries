<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border cellspacing="0" cellpadding="5" height="200px" width="500px"> <!-- cellspacing="0" removes space between cells and cellpadding="5" adds padding inside cells. the height and width we give are the minimum dimensions -->
        <thead>
            <tr>
                <th rowspan="2">S.No.</th>
                <th rowspan="2">Name</th>
                <th colspan="2">Address</th>
                <th rowspan="2">Phone</th>
            </tr>
            <tr>
                <th>Permanent</th>
                <th>Temporary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>John Doe</td>
                <td rowspan="2" colspan="2">123 Main St</td>
                <td>555-1234</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jane Smith</td>
                <td>555-5678</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Bob Johnson</td>
                <td>789 Pine Rd</td>
                <td>123 Main St</td>
                <td>555-9012</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Alice Williams</td>
                <td>321 Elm St</td>
                <td>654 Maple Ave</td>
                <td>555-3456</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="5" align="center">This is the end of the table</td> <!-- colspan makes the cell span across all columns -->
            </tr>
        </tfoot>
    </table>
</body>
</html>
