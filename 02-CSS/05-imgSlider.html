<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 450px;
            width: 75%;
            margin: auto;
            position: relative;
        }
        .img-slider{
            height: 100%;
            width: 100%;
        }
        .left{
            position: absolute;
            top: 50%;
            left: 0px;
        }
        .right{
            position: absolute;
            top: 50%;
            right: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./bliss-update.jpg" class="img-slider" alt=""> <!-- whenever you need to add image first use container then add the image -->
        <button class="left">&lt;&lt;</button>
        <button class="right">&gt;&gt;</button>
    </div>
</body>
</html>
