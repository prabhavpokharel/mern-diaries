    <!-- 

        there are various ways to add icons. some of them are:
        1. using svg: svg stands for scalable vector graphics. it is a vector image format that can be used to create icons. it is a good option for icons because it is scalable and can be easily styled with CSS.
        2. using font icons: font icons are a collection of icons that are available as a font. they can be easily styled with CSS and are scalable. some popular font icon libraries include Font Awesome, Material Icons, and Ionicons.
        3. using image icons: image icons are icons that are created as images. they can be in various formats such as PNG, JPEG, or GIF. they can be styled with CSS but are not scalable.

    -->
