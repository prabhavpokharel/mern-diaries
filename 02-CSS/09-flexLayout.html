<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        header{
            background-color: darkolivegreen;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        a{
            color: white;
            text-decoration: none; /* removes underline from link text */
        }
        h1{
            width: 25%;
            text-align: center;
        }
        nav{
            width: 50%;
            display: flex;
            justify-content: space-evenly;
        }
    </style>
</head>

<body>
    <header>
        <h1>Header</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Gallery</a>
            <a href="#">Blogs</a>
            <a href="#">Contact</a>
        </nav>
    </header>
</body>

</html>
