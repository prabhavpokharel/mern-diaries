<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            display: grid;
            /* grid-template-rows: 200px 250px 300px;  */
            /* grid template rows is a shorthand property for defining the height of each row in the grid. the syntax is grid-template-rows: <length> <length> <length>;  but is less used than grid-template-columns */
            
            /* grid-template-columns: 200px auto auto 30px; */

            grid-template-columns: 25% 30% 20% 25%; /* grid template columns is a shorthand property for defining the width of each column in the grid. the syntax is grid-template-columns: <length> <length> <length>; the sum of all column widths should equal 100% */

            /* grid-template-columns: 1fr 2fr 1fr 9fr; */
            /* fr stands for "fraction" and represents a fraction of the available space in the grid container like 1fr means one fraction of the available space, 2fr means two fractions of the available space, etc. */

            /* grid-template-columns: 200px repeat(3, auto); */
            /* we can use the repeat() function to simplify the code when we have multiple columns with the same width. what it does is repeat the specified value a certain number of times */
        }
        .item1{
            background-color: skyblue;

            /* grid-column-start: 1;
            grid-column-end: 5; */
            grid-column: 1/5; /* this is a shorthand property for grid-column-start and grid-column-end. the syntax is grid-column: <start> / <end>; where start is the line where the item starts and end is the line where the item ends. in this case, item1 will start at line 1 and end at line 5, which means it will span across all 4 columns */

            grid-row: 1;
            height: 6vh;
            text-align: center;
        }
        .item2{
            background-color: purple;
            grid-column: 1;
            grid-row: 2/5;
            height: 90vh;
        }
        .item7{
            background-color: green;
            grid-column: 3/5;
            grid-row: 2/4;
        }
        .item8{
            background-color: burlywood;
            grid-column: 2/4;
            grid-row: 4;
        }
        .item6{
            background-color: chocolate;
            grid-column: 2/5;
            grid-row: 5;
            height: 30vh;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item2">2</div>
        <div class="item6">6</div>
        <div class="item7">7</div>
        <div class="item1">1</div>
        <div class="item8">8</div>
        <div class="item9">9</div>
    </div>
</body>
</html>
