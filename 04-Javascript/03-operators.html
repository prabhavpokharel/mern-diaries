<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // Operators:
        //  1. Arithmetic operators: it is used to perform arithmetic operations on numbers. eg: +, -, *, /, %, ++, --, **, etc.
        //  2. Assignment operators: it is used to assign values to variables. eg: =, +=, -=, *=, /=, %=, **=, etc.

        let a = 5
        let b = 4
        document.write("<br>Sum = ", a+b)
        document.write("<br>Sum = " + a + b)
        document.write("<br>Difference = ", a-b)
        document.write("<br>Product = ", a * b)
        document.write("<br>Division = ", a / b)
        document.write("<br>Remainder = ", a % b)
        document.write("<br>Exponent (a^b) = ", a ** b)

        a = 5
        a += 5 // a = a + 5
        document.write("<br>A = ", a)
        a -= 1
        document.write("<br>A = ", a)
        a *= 3
        document.write("<br>A = ", a)
        a /= 5
        document.write("<br>A = ", a)
        a **= 2
        document.write("<br>A = ", a)
    </script>
</body>
</html>
