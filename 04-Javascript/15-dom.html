<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        .header a{
            color: black;
        }
        .header_dark a{
            color: white;
        }
        .pwdField{
            position: relative;
            background-color: black;
            width: 200px;
        }
        #pwd{
            width: 100%;
        }
        #pwdBtn{
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translate(0, -50%);
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body id="body">
    <!-- 
    
        In simple terms, Document Object Model (DOM) is a programming interface for web documents. It represents the page so that programs can change the document structure, style, and content. The DOM represents the document as nodes and objects; that way, programming languages can interact with the page.

    -->

    <button id="mode" class="test" name="test" onclick="toggleMode()"></button>
    <!-- <button class="test" name="test"></button> -->

    <div class="pwdField">
        <input type="password" id="pwd">
        <span id="pwdBtn" onclick="togglePasswordField()">SHOW</span>
    </div>
    
    <script>
        let pwd = document.querySelector('#pwd')
        let pwdBtn = document.querySelector('#pwdBtn')

        pwdBtn.innerHTML = '<i class = "bi bi-eye"></i>'
        let pwdStatus = 'password'

        const togglePasswordField = () => {
            pwdStatus = pwdStatus === 'password' ? 'text' : 'password'
            pwdBtn.innerHTML = pwdStatus === 'password' ? '<i class = "bi bi-eye"></i>' : '<i class = "bi bi-eye-slash"></i>'

            pwd.type = pwdStatus

            // Alternative way of doing it
            // pwd.setAttribute('type', pwdStatus)

        }

        // html part
        let body = document.getElementById('body')

        let header = document.createElement('header')
        body.append(header)

        // use can also give CSS in JS
        // css styling part
        header.style.height = '50px'
        header.style.width = '100%'
        header.style.backgroundColor = 'skyblue'
        header.style.position = 'fixed'
        header.style.top = '0'

        body.style.paddingTop = '50px'

        let menuItems = ["HOME", "ABOUT", "GALLERY", "SERVICES", "BLOGS", "CONTACT"]
        menuItems.map(item => {
            let menuItem = document.createElement('a')
            menuItem.innerText = item
            menuItem.href = `${item}.html`

            menuItem.style.textDecoration = 'none'

            header.appendChild(menuItem)
        })

        header.style.display = 'flex'
        header.style.justifyContent = 'space-evenly'
        header.style.alignItems = 'center'

        let darkMode = false

        let modeBtn = document.querySelector('#mode')
        modeBtn.innerHTML = darkMode ? "DARK" : "LIGHT"

        const toggleMode = () => {
            darkMode = !darkMode
            modeBtn.innerHTML = darkMode ? "DARK" : "LIGHT"

            header.style.backgroundColor = darkMode ? 'black' : 'skyblue'

            darkMode ? header.classList.add('header_dark') : header.classList.remove('header_dark')
        }

        // let modeBtn = document.querySelector('.test')
        // it takes the first button with test class
        
        // let btn = document.getElementsByClassName('test')
        // btn[0].innerHTML = 'first'
        // btn[1].innerHTML = 'second'
        
        // let btn = document.getElementsByTagName('button')
        // btn[0].innerHTML = 'FIRST'
        // btn[1].innerHTML = 'SECOND'
        
        // let btn = document.getElementsByName('test')
        // btn[0].innerHTML = 'FIRST'
        // btn[1].innerHTML = 'SECOND'

        // let modeBtn = document.getElementById('mode')
        // let modeBtn = document.querySelector('#mode')
    </script>
</body>
</html>
